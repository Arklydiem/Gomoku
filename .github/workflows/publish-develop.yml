name: Publish develop images

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GHCR_NAMESPACE: arklydiem

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./gomoku-core-api
          file: ./gomoku-core-api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_NAMESPACE }}/gomoku-core-api:develop
            ghcr.io/${{ env.GHCR_NAMESPACE }}/gomoku-core-api:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./gomoku-web-ang
          file: ./gomoku-web-ang/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_NAMESPACE }}/gomoku-web-ang:develop
            ghcr.io/${{ env.GHCR_NAMESPACE }}/gomoku-web-ang:${{ github.sha }}