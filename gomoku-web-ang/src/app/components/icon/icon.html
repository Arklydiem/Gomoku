<div
  class="spin-wrapper"
  [class.spin]="spin">

@if (name === 'arrow') {
  <svg
    class="icon"
    [style.transform]="'rotate(' + rotation + 'deg)'"

    [attr.width]="size"
    [attr.height]="size"

    viewBox="0 0 24 24"

    fill="none"

    stroke="currentColor"
    stroke-width="2"

    stroke-linecap="round"
    stroke-linejoin="round">

    <path d="M19 12H5"></path>
    <path d="M12 19l-7-7 7-7"></path>

  </svg>
}
</div>
