<div class="spin-wrapper"
	[class.spin]="spin">

	@switch (name) {
		@case ('arrow') {
			<svg class="icon"
				[style.transform]="'rotate(' + rotation + 'deg)'"
				[attr.width]="size"
				[attr.height]="size"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round">

				<path d="M19 12H5"/>
				<path d="M12 19l-7-7 7-7"/>
			</svg>
		}

		@case ('close') {
			<svg class="icon"
				[attr.width]="size"
				[attr.height]="size"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round">

				<path d="M18 6L6 18"/>
				<path d="M6 6l12 12"/>
			</svg>
		}

		@case ('burger-menu') {
			<svg class="icon"
				[style.transform]="'rotate(' + rotation + 'deg)'"
				[attr.width]="size"
				[attr.height]="size"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round">

				<path d="M4 18H20"/>
				<path d="M4 12H20"/>
				<path d="M4 6H20"/>
			</svg>
		}
	}
</div>
