<section class="game-match">

  <header class="game-header">

    <div class="game-title">

      <span class="eyebrow">
        MATCH
      </span>

      <h1>
        Gomoku
      </h1>

    </div>

    <div class="game-meta">

      <span class="game-status">
        {{ game().status }}
      </span>

      @if (isSpectator()) {
        <span class="spectator-badge">
          Spectator
        </span>
      }

    </div>

  </header>

  <div class="game-layout">

    <aside class="player-panel">

      <div class="player-card">

        <span class="stone black"></span>

        <div class="player-content">

          <span class="player-label">
            BLACK
          </span>

          <strong>
            Player 1
          </strong>

        </div>

      </div>

      <div class="game-stat">

        <span>
          Captures
        </span>

        <strong>
          0
        </strong>

      </div>

    </aside>

    <main class="board-container">

      <div class="board-placeholder">
        GAME BOARD
      </div>

    </main>

    <aside class="player-panel">

      <div class="player-card">

        <span class="stone white"></span>

        <div class="player-content">

          <span class="player-label">
            WHITE
          </span>

          <strong>
            Player 2
          </strong>

        </div>

      </div>

      <div class="game-stat">

        <span>
          Captures
        </span>

        <strong>
          0
        </strong>

      </div>

    </aside>

  </div>

</section>
